name: ci

on:
  push:
    branches: [main]
    paths:
      - "app/**"
  pull_request:
    branches: [main]
    paths:
      - "app/**"

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: echo "tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Write dhi.io token for BuildKit
        run: echo "${{ secrets.DHI_IO_TOKEN }}" > /tmp/dhi_token.txt

      - name: Build Docker image
        run: |
          docker build \
            --progress=plain \
            --pull \
            --secret id=dhi_token,src=/tmp/dhi_token.txt \
            -t gatus:${{ steps.meta.outputs.tag }} ./app/gatus

      - name: Scan image with Anchore
        uses: anchore/scan-action@v6
        with:
          image: gatus:${{ steps.meta.outputs.tag }}
          severity-cutoff: high

      - name: Save image for downstream workflows
        run: docker save gatus:${{ steps.meta.outputs.tag }} | gzip > image.tar.gz

      - name: Upload image artefact
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar.gz