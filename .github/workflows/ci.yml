name: ci pipeline

on:
  push:
    branches: [main]
    paths: [
      "app/**",
      "infra/**"
    ]
  pull_request:
    branches: [main]
    paths: [
      "app/**",
      "infra/**"
    ]
  workflow_dispatch:

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - "app/**"
            infra:
              - "infra/**"

  ci-app:
    name: ci-app
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'

    steps:

      - name: checkout code
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0

      - name: docker build (validation only)
        run: docker build -t ci:test ./app/gatus

      - name: scan image
        uses: anchore/scan-action@v6
        with:
          image: "ci:test"
          severity-cutoff: high

  ci-infra:
    name: ci-infra
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.infra == 'true'

    steps:

      - name: checkout code
        uses: actions/checkout@v4

      - name: setup terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.5

      - name: terraform fmt
        working-directory: infra/
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        working-directory: infra/
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: infra/
        run: terraform validate

      - name: install tflint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: run tflint
        working-directory: infra/
        run: tflint

      - name: CI summary
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Docker image built successfully" >> $GITHUB_STEP_SUMMARY
          echo "- Terraform formatting checked" >> $GITHUB_STEP_SUMMARY
          echo "- Terraform configuration validated" >> $GITHUB_STEP_SUMMARY
          echo "- tflint checks completed" >> $GITHUB_STEP_SUMMARY
          echo "- Container image scanned for high severity issues" >> $GITHUB_STEP_SUMMARY