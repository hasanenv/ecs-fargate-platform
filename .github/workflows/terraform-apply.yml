name: terraform apply

on: 
  workflow_run:
    workflows: ["ci pipeline"]
    types:
      - completed
      
  workflow_dispatch:

env:
  TF_VAR_image_tag: ${{ github.sha }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_owner: ${{ vars.OWNER }}
  TF_VAR_availability_zones: ${{ vars.AVAILABILITY_ZONES }} 
  TF_VAR_vpc_cidr: ${{ vars.VPC_CIDR }}
  TF_VAR_public_subnet_cidrs: ${{ vars.PUBLIC_SUBNET_CIDRS }}
  TF_VAR_private_subnet_cidrs: ${{ vars.PRIVATE_SUBNET_CIDRS }}

permissions:
  contents: read
  id-token: write

jobs:

  terraform-apply:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: terraform-apply
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/terraform-apply-role
          aws-region: ${{ env.TF_VAR_aws_region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.5

      - name: Terraform Init
        working-directory: ./infra/
        run: terraform init

      - name: check iam role
        run: aws sts get-caller-identity

      - name: Terraform Apply
        working-directory: ./infra/
        run: terraform apply -auto-approve

      - name: Terraform apply summary
        run: |
          echo "### Terraform apply completed successfully" >> $GITHUB_STEP_SUMMARY