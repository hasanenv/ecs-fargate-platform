whitelists:
  items:
    - id: zlib-untgz-unreachable
      description: >
        CVE-2026-22184 affects the untgz utility in zlib.
        The application does not extract archives and does not invoke untgz.
        
        At startup, configuration from an environment variable is written
        to a file inside the container filesystem, then the Go binary is
        executed directly.

        The vulnerable code path is unreachable in this container.
        Container runs as non-root.
      trigger_ids:
        - CVE-2026-22184