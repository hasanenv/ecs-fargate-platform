name: ci pipeline

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "infra/**"

  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "infra/**"

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      infra: ${{ steps.filter.outputs.infra }}

    steps:

      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - "app/**"
            infra:
              - "infra/**"

  ci-app:
    name: ci-app
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: docker build (validation only)
        run: docker build -t ci:test ./app/gatus

      - name: scan image
        uses: anchore/scan-action@v6
        with:
          image: gatus:${{ steps.meta.outputs.tag }}
          severity-cutoff: high
          config-file: ./anchore.yml

      - name: app ci summary
        run: |
          echo "### Application code passed all checks" >> $GITHUB_STEP_SUMMARY

  ci-infra:
    name: ci-infra
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.5

      - name: terraform fmt
        working-directory: infra/
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        working-directory: infra/
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: infra/
        run: terraform validate

      - name: install tflint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: run tflint
        working-directory: infra/
        run: tflint

      - name: terraform ci summary
        run: |
          echo "### Terraform code passed all checks" >> $GITHUB_STEP_SUMMARY
